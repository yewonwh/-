<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 동네 탄소 발자국 계산기</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(64, 200, 120, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(39, 142, 232, 0.25), transparent 35%),
        linear-gradient(135deg, #dff8e6 0%, #d9f1ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #1f3d36;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 30px;
      padding: 38px;
      box-shadow: 0 22px 50px rgba(38, 115, 91, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
    }

    .header {
      text-align: center;
      margin-bottom: 34px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #e8f8ee;
      color: #16804f;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 35px;
      line-height: 1.25;
      color: #123c34;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #5f756f;
      font-size: 16px;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 22px;
    }

    .section {
      border-radius: 24px;
      padding: 24px;
      background: #f7fcfa;
      border: 1px solid #dbeee7;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
      color: #1d5f4a;
      margin-bottom: 18px;
    }

    .icon {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #40c878, #39a9db);
      color: white;
      font-size: 19px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 800;
      color: #31564d;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px 56px 15px 16px;
      border: 1px solid #cfe5dc;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      background: white;
      color: #1f3d36;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #37b875;
      box-shadow: 0 0 0 4px rgba(55, 184, 117, 0.14);
    }

    .unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 800;
      color: #6b8a82;
    }

    .button-area {
      margin-top: 8px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 900;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, #22b86f, #278ee8);
      box-shadow: 0 14px 28px rgba(39, 142, 232, 0.25);
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(39, 142, 232, 0.32);
    }

    .result {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px);
      transition: 0.45s ease;
    }

    .result.show {
      max-height: 1200px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 30px;
    }

    .result-inner {
      padding: 28px;
      border-radius: 26px;
      background: linear-gradient(135deg, #ecfff4, #eef8ff);
      border: 1px solid #cdeee1;
      text-align: center;
    }

    .result-title {
      font-size: 18px;
      font-weight: 900;
      color: #16804f;
      margin-bottom: 10px;
    }

    .result-text {
      font-size: 27px;
      font-weight: 900;
      line-height: 1.4;
      color: #123c34;
      margin-bottom: 10px;
    }

    .result-text span {
      color: #278ee8;
    }

    .average-note {
      font-size: 13px;
      color: #6c827c;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .chart-box {
      max-width: 370px;
      margin: 0 auto;
    }

    .comparison-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.6;
    }

    .comparison-box.high {
      background: #fff4e8;
      color: #b45309;
      border: 1px solid #ffd6a6;
    }

    .comparison-box.normal {
      background: #eef8ff;
      color: #1d6fa5;
      border: 1px solid #c8e7ff;
    }

    .comparison-box.low {
      background: #ecfff4;
      color: #16804f;
      border: 1px solid #bdeed2;
    }

    .tips-box {
      margin-top: 16px;
      padding: 22px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #dbeee7;
      text-align: left;
    }

    .tips-box h3 {
      color: #1d5f4a;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .tips-box ul {
      padding-left: 20px;
      color: #425f57;
      line-height: 1.8;
      font-size: 15px;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #6c827c;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
        align-items: flex-start;
      }

      .card {
        padding: 24px;
        border-radius: 24px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        font-size: 14px;
      }

      .section {
        padding: 20px;
      }

      .input-grid {
        grid-template-columns: 1fr;
      }

      button {
        font-size: 16px;
        padding: 16px;
      }

      .result-inner {
        padding: 22px;
      }

      .result-text {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <span class="badge">Eco Carbon Calculator</span>
        <h1>우리 동네 탄소 발자국 계산기</h1>
        <p class="subtitle">
          생활 속 에너지 사용량과 이동 거리를 입력하고<br />
          나의 탄소 배출량을 간단하게 확인해 보세요.
        </p>
      </div>

      <form id="carbonForm">
        <section class="section">
          <div class="section-title">
            <span class="icon">🏠</span>
            <span>주거 에너지</span>
          </div>

          <div class="input-grid">
            <div class="input-group">
              <label for="electricity">전기 사용량</label>
              <div class="input-box">
                <input type="number" id="electricity" placeholder="예: 250" min="0" step="0.1" />
                <span class="unit">kWh</span>
              </div>
            </div>

            <div class="input-group">
              <label for="gas">도시가스 사용량</label>
              <div class="input-box">
                <input type="number" id="gas" placeholder="예: 30" min="0" step="0.1" />
                <span class="unit">m³</span>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-title">
            <span class="icon">🚌</span>
            <span>교통 이동</span>
          </div>

          <div class="input-grid">
            <div class="input-group">
              <label for="publicTransport">대중교통 이용 거리</label>
              <div class="input-box">
                <input type="number" id="publicTransport" placeholder="예: 120" min="0" step="0.1" />
                <span class="unit">km</span>
              </div>
            </div>

            <div class="input-group">
              <label for="car">자가용 이용 거리</label>
              <div class="input-box">
                <input type="number" id="car" placeholder="예: 100" min="0" step="0.1" />
                <span class="unit">km</span>
              </div>
            </div>
          </div>
        </section>

        <div class="button-area">
          <button type="submit">나의 탄소 발자국 계산하기</button>
        </div>
      </form>

      <section class="result" id="resultBox">
        <div class="result-inner">
          <p class="result-title">계산 결과</p>

          <p class="result-text">
            한 달 총 탄소 배출량은<br />
            <span id="totalCarbon">0</span> kg CO2eq 입니다.
          </p>

          <p class="average-note">
            평균 비교 기준은 수행평가용 예시값입니다.
            선생님이 다른 기준을 제시하면 코드의 평균값만 수정하면 됩니다.
          </p>

          <div class="chart-box">
            <canvas id="carbonChart"></canvas>
          </div>

          <div class="comparison-box" id="comparisonBox"></div>

          <div class="tips-box" id="tipsBox"></div>
        </div>
      </section>

      <p class="footer-note">
        작은 습관의 변화가 우리 동네의 더 깨끗한 미래를 만듭니다 🌱
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("carbonForm");
    const resultBox = document.getElementById("resultBox");
    const totalCarbonText = document.getElementById("totalCarbon");
    const chartCanvas = document.getElementById("carbonChart");
    const comparisonBox = document.getElementById("comparisonBox");
    const tipsBox = document.getElementById("tipsBox");

    let carbonChart = null;

    /*
      탄소 배출 계수
      전기: kWh × 0.4781
      도시가스: m³ × 2.176
      대중교통: km × 0.04
      자가용: km × 0.19
    */
    const emissionFactor = {
      electricity: 0.4781,
      gas: 2.176,
      publicTransport: 0.04,
      car: 0.19
    };

    /*
      수행평가용 예시 평균 사용량
      실제 학교 기준이나 지역 평균 자료가 있다면 아래 숫자만 바꾸면 됩니다.
    */
    const averageUsage = {
      electricity: 250,
      gas: 30,
      publicTransport: 120,
      car: 100
    };

    const averageCarbon =
      averageUsage.electricity * emissionFactor.electricity +
      averageUsage.gas * emissionFactor.gas +
      averageUsage.publicTransport * emissionFactor.publicTransport +
      averageUsage.car * emissionFactor.car;

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const electricity = Number(document.getElementById("electricity").value) || 0;
      const gas = Number(document.getElementById("gas").value) || 0;
      const publicTransport = Number(document.getElementById("publicTransport").value) || 0;
      const car = Number(document.getElementById("car").value) || 0;

      const electricityCarbon = electricity * emissionFactor.electricity;
      const gasCarbon = gas * emissionFactor.gas;
      const publicTransportCarbon = publicTransport * emissionFactor.publicTransport;
      const carCarbon = car * emissionFactor.car;

      const totalCarbon =
        electricityCarbon +
        gasCarbon +
        publicTransportCarbon +
        carCarbon;

      if (totalCarbon === 0) {
        alert("계산할 값을 하나 이상 입력해 주세요!");
        return;
      }

      totalCarbonText.textContent = totalCarbon.toFixed(2);
      resultBox.classList.add("show");

      showComparison(totalCarbon);
      showTips({
        electricity,
        gas,
        publicTransport,
        car,
        electricityCarbon,
        gasCarbon,
        publicTransportCarbon,
        carCarbon
      });

      drawChart({
        electricityCarbon,
        gasCarbon,
        publicTransportCarbon,
        carCarbon,
        totalCarbon
      });

      resultBox.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });

    function showComparison(totalCarbon) {
      comparisonBox.className = "comparison-box";

      if (totalCarbon > averageCarbon * 1.1) {
        comparisonBox.classList.add("high");
        comparisonBox.innerHTML = `
          평균보다 탄소 배출량이 높은 편입니다. ⚠️<br>
          내 배출량: ${totalCarbon.toFixed(2)} kg CO2eq /
          평균 기준: ${averageCarbon.toFixed(2)} kg CO2eq
        `;
      } else if (totalCarbon < averageCarbon * 0.9) {
        comparisonBox.classList.add("low");
        comparisonBox.innerHTML = `
          평균보다 탄소 배출량이 낮은 편입니다. 아주 좋아요! 🌱<br>
          내 배출량: ${totalCarbon.toFixed(2)} kg CO2eq /
          평균 기준: ${averageCarbon.toFixed(2)} kg CO2eq
        `;
      } else {
        comparisonBox.classList.add("normal");
        comparisonBox.innerHTML = `
          평균과 비슷한 탄소 배출량입니다. 🙂<br>
          내 배출량: ${totalCarbon.toFixed(2)} kg CO2eq /
          평균 기준: ${averageCarbon.toFixed(2)} kg CO2eq
        `;
      }
    }

    function showTips(data) {
      const tips = [];

      if (data.electricity > averageUsage.electricity) {
        tips.push("전기 사용량이 평균보다 높아요. 사용하지 않는 조명 끄기, 멀티탭 전원 차단, LED 조명 사용을 실천해 보세요.");
      }

      if (data.gas > averageUsage.gas) {
        tips.push("도시가스 사용량이 평균보다 높아요. 난방 온도를 1~2도 낮추고, 창문 틈새 단열을 해보세요.");
      }

      if (data.publicTransport > averageUsage.publicTransport) {
        tips.push("대중교통 이용 거리가 평균보다 많아요. 가까운 거리는 걷기나 자전거 이용을 함께 실천하면 더 좋아요.");
      }

      if (data.car > averageUsage.car) {
        tips.push("자가용 이용 거리가 평균보다 높아요. 가까운 거리는 걷기, 자전거, 대중교통을 이용하고 카풀도 고려해 보세요.");
      }

      const carbonList = [
        { name: "전기", value: data.electricityCarbon },
        { name: "도시가스", value: data.gasCarbon },
        { name: "대중교통", value: data.publicTransportCarbon },
        { name: "자가용", value: data.carCarbon }
      ];

      carbonList.sort((a, b) => b.value - a.value);
      const highest = carbonList[0];

      if (highest.value > 0) {
        tips.push(`이번 계산에서 가장 큰 비중을 차지한 항목은 '${highest.name}'입니다. 이 항목부터 줄이면 가장 효과적이에요.`);
      }

      if (tips.length === 0) {
        tipsBox.innerHTML = `
          <h3>생활 실천 팁</h3>
          <ul>
            <li>현재 사용량은 평균보다 높지 않아요. 지금처럼 친환경 생활 습관을 유지해 보세요.</li>
            <li>가까운 거리는 걷거나 자전거를 이용하면 탄소 배출량을 더 줄일 수 있어요.</li>
            <li>전기 플러그를 뽑고, 냉난방 온도를 적절히 조절하는 습관도 도움이 됩니다.</li>
          </ul>
        `;
      } else {
        tipsBox.innerHTML = `
          <h3>탄소 발자국 줄이는 방법</h3>
          <ul>
            ${tips.map(tip => `<li>${tip}</li>`).join("")}
          </ul>
        `;
      }
    }

    function drawChart(data) {
      const chartData = [
        data.electricityCarbon,
        data.gasCarbon,
        data.publicTransportCarbon,
        data.carCarbon
      ];

      if (carbonChart) {
        carbonChart.destroy();
      }

      carbonChart = new Chart(chartCanvas, {
        type: "doughnut",
        data: {
          labels: ["전기", "도시가스", "대중교통", "자가용"],
          datasets: [
            {
              data: chartData,
              backgroundColor: [
                "#22b86f",
                "#39a9db",
                "#8bd450",
                "#278ee8"
              ],
              borderColor: "#ffffff",
              borderWidth: 4,
              hoverOffset: 10
            }
          ]
        },
        options: {
          responsive: true,
          cutout: "62%",
          plugins: {
            legend: {
              position: "bottom",
              labels: {
                padding: 18,
                font: {
                  size: 13,
                  weight: "bold"
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const value = context.raw;
                  const percentage = ((value / data.totalCarbon) * 100).toFixed(1);
                  return `${context.label}: ${value.toFixed(2)} kg CO2eq (${percentage}%)`;
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
