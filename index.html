<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 동네 탄소 발자국 계산기</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(135deg, #dff8e6 0%, #d9f1ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #1f3d36;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 20px 45px rgba(38, 115, 91, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #e8f8ee;
      color: #16804f;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.25;
      color: #123c34;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #5f756f;
      font-size: 16px;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 22px;
    }

    .section {
      border-radius: 22px;
      padding: 24px;
      background: #f7fcfa;
      border: 1px solid #dbeee7;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #1d5f4a;
      margin-bottom: 18px;
    }

    .icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #40c878, #39a9db);
      color: white;
      font-size: 18px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #31564d;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px 54px 15px 16px;
      border: 1px solid #cfe5dc;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      background: white;
      color: #1f3d36;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #37b875;
      box-shadow: 0 0 0 4px rgba(55, 184, 117, 0.14);
    }

    .unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 700;
      color: #6b8a82;
    }

    .button-area {
      margin-top: 8px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, #22b86f, #278ee8);
      box-shadow: 0 14px 28px rgba(39, 142, 232, 0.25);
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(39, 142, 232, 0.32);
    }

    .result {
      display: none;
      margin-top: 28px;
      padding: 28px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ecfff4, #eef8ff);
      border: 1px solid #cdeee1;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: 0.4s ease;
    }

    .result.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .result-title {
      font-size: 18px;
      font-weight: 800;
      color: #16804f;
      margin-bottom: 10px;
    }

    .result-text {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.4;
      color: #123c34;
      margin-bottom: 22px;
    }

    .result-text span {
      color: #278ee8;
    }

    .chart-box {
      max-width: 360px;
      margin: 0 auto;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #6c827c;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
        align-items: flex-start;
      }

      .card {
        padding: 24px;
        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 14px;
      }

      .section {
        padding: 20px;
      }

      .input-grid {
        grid-template-columns: 1fr;
      }

      button {
        font-size: 16px;
        padding: 16px;
      }

      .result-text {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <span class="badge">Eco Carbon Calculator</span>
        <h1>우리 동네 탄소 발자국 계산기</h1>
        <p class="subtitle">
          생활 속 에너지 사용량과 이동 거리를 입력하고<br />
          나의 탄소 배출량을 간단하게 확인해 보세요.
        </p>
      </div>

      <form id="carbonForm">
        <section class="section">
          <div class="section-title">
            <span class="icon">🏠</span>
            <span>주거 에너지</span>
          </div>

          <div class="input-grid">
            <div class="input-group">
              <label for="electricity">전기 사용량</label>
              <div class="input-box">
                <input type="number" id="electricity" placeholder="예: 250" min="0" />
                <span class="unit">kWh</span>
              </div>
            </div>

            <div class="input-group">
              <label for="gas">도시가스 사용량</label>
              <div class="input-box">
                <input type="number" id="gas" placeholder="예: 30" min="0" />
                <span class="unit">m³</span>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-title">
            <span class="icon">🚌</span>
            <span>교통 이동</span>
          </div>

          <div class="input-grid">
            <div class="input-group">
              <label for="publicTransport">대중교통 이용 거리</label>
              <div class="input-box">
                <input type="number" id="publicTransport" placeholder="예: 120" min="0" />
                <span class="unit">km</span>
              </div>
            </div>

            <div class="input-group">
              <label for="car">자가용 이용 거리</label>
              <div class="input-box">
                <input type="number" id="car" placeholder="예: 80" min="0" />
                <span class="unit">km</span>
              </div>
            </div>
          </div>
        </section>

        <div class="button-area">
          <button type="submit">나의 탄소 발자국 계산하기</button>
        </div>
      </form>

      <section class="result" id="resultBox">
        <p class="result-title">계산 결과</p>
        <p class="result-text">
          한 달 총 탄소 배출량은 <span id="totalCarbon">0</span> kg CO2eq 입니다.
        </p>

        <div class="chart-box">
          <canvas id="carbonChart"></canvas>
        </div>
      </section>

      <p class="footer-note">
        작은 습관의 변화가 우리 동네의 더 깨끗한 미래를 만듭니다 🌱
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("carbonForm");
    const resultBox = document.getElementById("resultBox");
    const totalCarbonText = document.getElementById("totalCarbon");
    const chartCanvas = document.getElementById("carbonChart");

    let carbonChart = null;

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const electricity = Number(document.getElementById("electricity").value) || 0;
      const gas = Number(document.getElementById("gas").value) || 0;
      const publicTransport = Number(document.getElementById("publicTransport").value) || 0;
      const car = Number(document.getElementById("car").value) || 0;

      const electricityCarbon = electricity * 0.4781;
      const gasCarbon = gas * 2.176;
      const publicTransportCarbon = publicTransport * 0.04;
      const carCarbon = car * 0.19;

      const totalCarbon =
        electricityCarbon +
        gasCarbon +
        publicTransportCarbon +
        carCarbon;

      if (totalCarbon === 0) {
        alert("계산할 값을 하나 이상 입력해 주세요!");
        return;
      }

      totalCarbonText.textContent = totalCarbon.toFixed(2);
      resultBox.classList.add("show");

      const chartData = [
        electricityCarbon,
        gasCarbon,
        publicTransportCarbon,
        carCarbon
      ];

      if (carbonChart) {
        carbonChart.destroy();
      }

      carbonChart = new Chart(chartCanvas, {
        type: "doughnut",
        data: {
          labels: ["전기", "도시가스", "대중교통", "자가용"],
          datasets: [
            {
              data: chartData,
              backgroundColor: [
                "#22b86f",
                "#39a9db",
                "#8bd450",
                "#278ee8"
              ],
              borderColor: "#ffffff",
              borderWidth: 4,
              hoverOffset: 10
            }
          ]
        },
        options: {
          responsive: true,
          cutout: "62%",
          plugins: {
            legend: {
              position: "bottom",
              labels: {
                padding: 18,
                font: {
                  size: 13,
                  weight: "bold"
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const value = context.raw;
                  const percentage = ((value / totalCarbon) * 100).toFixed(1);
                  return `${context.label}: ${value.toFixed(2)} kg CO2eq (${percentage}%)`;
                }
              }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
